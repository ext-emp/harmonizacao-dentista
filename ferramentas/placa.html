<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Ferramenta: placas provisórias e Open Graph</title>
    <link rel="stylesheet" href="/src/css/fontes.css" />
    <link rel="stylesheet" href="/src/css/tokens.css" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      svg {
        display: block;
      }
      body {
        font-family: var(--fonte-texto);
        -webkit-font-smoothing: antialiased;
      }
      .placa {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 28px;
        text-align: center;
      }
      .placa--antes {
        background: radial-gradient(120% 90% at 50% 40%, #efe9df, #ddd4c7);
        color: #3d3934;
      }
      .placa--depois {
        background: radial-gradient(120% 90% at 50% 40%, #f8f6f1, #e7e1d8);
        color: #3d3934;
      }
      .placa__moldura {
        position: absolute;
        inset: 54px;
        border: 1px solid rgb(22 21 19 / 0.14);
      }
      .placa__caso {
        font-family: var(--fonte-titulo);
        font-size: 168px;
        line-height: 0.9;
        letter-spacing: -0.03em;
      }
      .placa__caso em {
        font-style: italic;
      }
      .placa__rotulo {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #645e55;
      }

      /* Open Graph */
      .og {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 440px;
        align-items: center;
        padding: 0 64px 0 80px;
        background: #f3efe8;
        color: #161513;
      }
      .og__monograma {
        width: 96px;
        height: 64px;
        margin-bottom: 32px;
      }
      .og__nome {
        font-family: var(--fonte-titulo);
        font-size: 96px;
        line-height: 0.92;
        letter-spacing: -0.03em;
      }
      .og__linha {
        margin-top: 30px;
        font-size: 22px;
        line-height: 1.45;
        color: #645e55;
      }
      .og__perola {
        width: 440px;
        height: 440px;
      }
    </style>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module">
      import { doutor } from '/src/dados/doutor.js';

      const p = new URLSearchParams(location.search);
      const raiz = document.getElementById('raiz');

      if (p.get('tipo') === 'og') {
        raiz.innerHTML = `
          <div class="og">
            <div>
              <svg class="og__monograma" viewBox="0 0 60 40" fill="none" stroke="#161513" stroke-linecap="square">
                <path d="M7 6v28M7 20h17M24 6v28M24 6l14 23 14-23v28" stroke-width="1.3"/>
                <path d="M3.5 6h7M3.5 34h7M20.5 6h3.5M20.5 34h7M52 6h3.5M48.5 34h7" stroke-width="0.9"/>
              </svg>
              <p class="og__nome">${doutor.tratamento} ${doutor.nome}</p>
              <p class="og__linha">${doutor.profissao} · ${doutor.endereco.cidade}/${doutor.endereco.uf}<br>Harmonização orofacial e lentes de contato dental</p>
            </div>
            <img class="og__perola" src="/img/hero/perola-800.webp" alt="">
          </div>`;
      } else {
        const lado = p.get('lado') === 'depois' ? 'depois' : 'antes';
        raiz.innerHTML = `
          <div class="placa placa--${lado}">
            <div class="placa__moldura"></div>
            <p class="placa__caso">Caso <em>${p.get('n') || '01'}</em></p>
            <p class="placa__rotulo">Foto provisória · ${lado}</p>
          </div>`;
      }

      await document.fonts.ready;
      await Promise.all([...document.images].map((img) => (img.complete ? null : new Promise((r) => (img.onload = img.onerror = r)))));
      window.__pronta = true;
    </script>
  </body>
</html>
