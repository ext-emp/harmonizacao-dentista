<!-- O espaço (segunda seção, no estilo da LAVA dental):
       1. Abertura: a frase e o ponto onde a pérola que vem do hero pousa.
       2. Galeria: o palco fica fixo e as fotos do consultório passam na
          horizontal conforme o scroll. A última abre até a tela cheia e vira
          o fundo do manifesto, que vem logo depois (aninhado aqui para o
          fundo continuar fixo atrás dele).
     Sem JavaScript ou com movimento reduzido, a galeria é uma faixa com
     scroll lateral nativo e o manifesto vem sobre o grafite.
     Fotos do consultório: as de agora são fotos de banco (Unsplash) de outras
     clínicas, provisórias (docs/creditos-imagens.md). Nada de paciente nas fotos. -->
<section class="espaco" id="espaco" data-tema="escuro" data-pilha aria-labelledby="espaco-titulo" tabindex="-1" data-espaco>
  <div class="espaco__abertura grade">
    <!-- Ponto de pouso da pérola (vazio sem JavaScript; só marca a posição). -->
    <span class="perola-pouso" aria-hidden="true" data-perola-pouso></span>
    <p class="espaco__rotulo rotulo texto-2" data-revelar="subir">O espaço</p>
    <h2 class="espaco__frase titulo-2" id="espaco-titulo" data-revelar="linhas" data-revelar-inicio="top 62%" data-linhas>
      Antes de qualquer tratamento, um lugar para <em>conversar com calma.</em>
    </h2>
  </div>

  <div class="espaco__palco" data-espaco-palco data-fixa>
    <ul class="espaco__trilho" data-espaco-trilho aria-label="Fotos do consultório (provisórias)">
      <li class="espaco__foto espaco__foto--deitada">
        <x-img
          src="espaco/espaco-01"
          alt="Foto provisória de uma recepção clara, com bancos brancos e uma árvore no centro"
          sizes="(min-width: 64em) 87vh, 80vw"
          class="espaco__img"
          classe-picture="espaco__picture"
        ></x-img>
      </li>
      <li class="espaco__foto espaco__foto--em-pe">
        <x-img
          src="espaco/espaco-02"
          alt="Foto provisória de uma passagem em arco para uma sala de espera com duas poltronas"
          sizes="(min-width: 64em) 42vh, 52vw"
          class="espaco__img"
          classe-picture="espaco__picture"
        ></x-img>
      </li>
      <li class="espaco__foto espaco__foto--deitada">
        <x-img
          src="espaco/espaco-03"
          alt="Foto provisória de um consultório odontológico claro, com a cadeira e o piso de madeira"
          sizes="(min-width: 64em) 87vh, 80vw"
          class="espaco__img"
          classe-picture="espaco__picture"
        ></x-img>
      </li>
      <li class="espaco__foto espaco__foto--em-pe">
        <x-img
          src="espaco/espaco-04"
          alt="Foto provisória de um corredor com paredes almofadadas, quadros e uma poltrona ao fundo"
          sizes="(min-width: 64em) 42vh, 52vw"
          class="espaco__img"
          classe-picture="espaco__picture"
        ></x-img>
      </li>
      <!-- A última foto: com JavaScript, abre até a tela cheia e vira o fundo. -->
      <li class="espaco__foto espaco__foto--deitada espaco__foto--fundo" data-espaco-fundo>
        <div class="espaco__fundo-imagem" data-espaco-fundo-imagem>
          <x-img
            src="espaco/espaco-05"
            alt="Foto provisória de um canto de espera à meia-luz, com abajur e poltronas"
            sizes="(max-aspect-ratio: 3/2) 165vh, 110vw"
            class="espaco__img"
            classe-picture="espaco__picture"
          ></x-img>
        </div>
        <span class="espaco__veu" aria-hidden="true" data-espaco-veu></span>
      </li>
    </ul>
    <p class="espaco__provisorio etiqueta-provisoria rotulo" data-espaco-provisorio>Fotos provisórias</p>
  </div>
  <!-- Trecho de scroll em que a galeria anda (a altura vem do JavaScript). -->
  <div class="espaco__percurso" aria-hidden="true" data-espaco-percurso></div>

  <!-- @incluir secoes/manifesto.html -->
</section>
