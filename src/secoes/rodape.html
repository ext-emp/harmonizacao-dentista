<!-- Rodapé: o nome gigante ocupando toda a largura e, abaixo, a assinatura
     exigida pelo CFO (nome, profissão e CRO), vinda de src/dados/doutor.js. -->
<footer class="rodape" data-tema="escuro">
  <div class="grade">
    <p class="rodape__nome" aria-hidden="true" data-revelar="letras">{{ doutor.nome }}</p>

    <div class="rodape__base">
      <p class="rodape__assinatura">{{ assinatura }}</p>
      <p class="rodape__ano texto-2">© {{ ano }}</p>
      <a class="rodape__topo link-linha area-toque" href="#inicio" data-toque-centro>Voltar ao início</a>
    </div>
  </div>
</footer>
