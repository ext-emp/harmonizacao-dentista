<!-- Rodapé: o nome gigante ocupando toda a largura e, abaixo, a assinatura
     exigida pelo CFO (nome, profissão e CRO), vinda de src/dados/doutor.js.
     No celular o nome gigante sai (ele abre o contato) e a assinatura quebra
     em duas linhas, nome e profissão em cima e o CRO embaixo (rodape.css). -->
<footer class="rodape" data-tema="escuro">
  <div class="grade">
    <p class="rodape__nome" aria-hidden="true" data-revelar="letras">{{ doutor.nome }}</p>

    <div class="rodape__base">
      <p class="rodape__assinatura"><span class="rodape__trecho">{{ nomeCompleto }} · {{ doutor.profissao }}</span><span class="rodape__separador"> · </span><span class="rodape__trecho">{{ cro }}</span></p>
      <p class="rodape__ano texto-2">© {{ ano }}</p>
      <a class="rodape__topo link-linha area-toque" href="#inicio" data-toque-centro>Voltar ao início<svg class="rodape__seta" aria-hidden="true" focusable="false"><use href="#seta" /></svg></a>
    </div>
  </div>
</footer>
