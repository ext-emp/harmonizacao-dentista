<!-- Símbolos SVG reutilizados (monograma, olho do slider, seta, ícones do
     contato). Fica escondido.
     Desenhos próprios, em traço fino, no mesmo peso do monograma. -->
<svg class="visualmente-oculto" aria-hidden="true" focusable="false">
  <!-- Olho do botão do antes e depois: amêndoa e pupila -->
  <symbol id="olho" viewBox="0 0 24 24">
    <path
      d="M2.75 12c2.55-4.1 5.65-6.15 9.25-6.15s6.7 2.05 9.25 6.15c-2.55 4.1-5.65 6.15-9.25 6.15S5.3 16.1 2.75 12z"
      fill="none"
      stroke="currentColor"
      stroke-width="1.25"
      stroke-linejoin="round"
    />
    <circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.25" />
  </symbol>

  <!-- Seta das setas do carrossel (aponta para a direita; a anterior é espelhada) -->
  <symbol id="seta" viewBox="0 0 24 24">
    <path d="M3.5 12h16.5M14 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" />
  </symbol>

  <!-- Ícones dos atalhos do contato no celular: balão de conversa, pino do
       mapa e a câmera do Instagram -->
  <symbol id="conversa" viewBox="0 0 24 24">
    <path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
  </symbol>

  <symbol id="pino" viewBox="0 0 24 24">
    <path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
    <circle cx="12" cy="10" r="2" fill="none" stroke="currentColor" stroke-width="1.4" />
  </symbol>

  <symbol id="camera" viewBox="0 0 24 24">
    <rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.4" />
    <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.4" />
    <circle cx="17.2" cy="6.8" r="0.9" fill="currentColor" />
  </symbol>

  <symbol id="monograma" viewBox="0 0 60 40">
    <!-- O H e o M dividem a haste central; serifas finas nas pontas -->
    <path
      d="M7 6v28M7 20h17M24 6v28M24 6l14 23 14-23v28"
      fill="none"
      stroke="currentColor"
      stroke-linecap="square"
      style="stroke-width: var(--mono-traco, 1.4)"
    />
    <path
      d="M3.5 6h7M3.5 34h7M20.5 6h3.5M20.5 34h7M52 6h3.5M48.5 34h7"
      fill="none"
      stroke="currentColor"
      stroke-linecap="square"
      style="stroke-width: var(--mono-serifa, 1)"
    />
  </symbol>
</svg>
